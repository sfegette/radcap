name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Every hosted image's *default* Xcode drifts independently over time (macos-14
      # defaults to 15.4 despite also bundling 16.1/16.2; macos-15/26 default to newer
      # still). Pin explicitly to the highest version common to all three images rather
      # than relying on whatever each one happens to default to.
      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Radcap.xcodeproj -scheme Radcap

      - name: Run unit tests
        run: |
          # The two camera/mic recording tests need real hardware and aren't
          # reachable via CI=true inside the xcodebuild-spawned test host, so
          # they're excluded explicitly rather than relying on env propagation.
          xcodebuild test \
            -project Radcap.xcodeproj \
            -scheme Radcap \
            -configuration Debug \
            -destination 'platform=macOS' \
            -skip-testing:RadcapTests/RecordingFunctionalTests/testRecordMOVClipWithAudio \
            -skip-testing:RadcapTests/RecordingFunctionalTests/testRecordMP4ClipWithAudio \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}
