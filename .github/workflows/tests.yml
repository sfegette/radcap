name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      # Each hosted image's *default* Xcode drifts independently over time (macos-14
      # defaults to 15.4 despite also bundling 16.1/16.2). Apple's Xcode version scheme
      # also tracks the OS year now (16.x on macos-14/15, 26.x on macos-26), so there's
      # no single Xcode version installed on all three images — pin the highest one
      # available on each explicitly rather than trusting whatever's default.
      matrix:
        include:
          - runner: macos-14
            xcode: "16.2"
          - runner: macos-15
            xcode: "16.4"
          - runner: macos-26
            xcode: "26.6"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Radcap.xcodeproj -scheme Radcap

      - name: Run unit tests
        run: |
          # The two camera/mic recording tests need real hardware and aren't
          # reachable via CI=true inside the xcodebuild-spawned test host, so
          # they're excluded explicitly rather than relying on env propagation.
          xcodebuild test \
            -project Radcap.xcodeproj \
            -scheme Radcap \
            -configuration Debug \
            -destination 'platform=macOS' \
            -skip-testing:RadcapTests/RecordingFunctionalTests/testRecordMOVClipWithAudio \
            -skip-testing:RadcapTests/RecordingFunctionalTests/testRecordMP4ClipWithAudio \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}
