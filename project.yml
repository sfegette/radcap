name: Radcap
configs:
  Debug: debug
  DebugApp: debug
  Release: release
options:
  bundleIdPrefix: com.sfegette
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  Radcap:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Capture
      - path: Controllers
      - path: Views
      - path: Models
      - path: Assets.xcassets
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfegette.radcap
        MARKETING_VERSION: "1.0.6"
        CURRENT_PROJECT_VERSION: "18"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5"
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Radcap.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MX6K4V7DP6
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
        DebugApp:
          ENABLE_TESTABILITY: NO

  RadcapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Radcap
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfegette.radcap.tests
        SWIFT_VERSION: "5"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Radcap.app/Contents/MacOS/Radcap
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MX6K4V7DP6

schemes:
  Radcap:
    build:
      targets:
        Radcap: all
        RadcapTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: RadcapTests
    analyze:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
  RadcapApp:
    build:
      targets:
        Radcap: all
    run:
      config: DebugApp
    analyze:
      config: DebugApp
    profile:
      config: Release
    archive:
      config: Release
