name: Radcap
options:
  bundleIdPrefix: com.sfegette
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  Radcap:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Capture
      - path: Controllers
      - path: Views
      - path: Models
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfegette.radcap
        MARKETING_VERSION: "1.0.4"
        CURRENT_PROJECT_VERSION: "16"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5"
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Radcap.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MX6K4V7DP6
      configs:
        Debug:
          ENABLE_TESTABILITY: YES

  RadcapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Radcap
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfegette.radcap.tests
        SWIFT_VERSION: "5"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Radcap.app/Contents/MacOS/Radcap
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
